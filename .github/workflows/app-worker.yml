name: App checks
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-path-guard-app-worker
  cancel-in-progress: false
jobs:
  check:
    if: ${{ vars.APP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check installed repositories
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          MARKETPLACE_FREE_PLAN_ID: ${{ vars.MARKETPLACE_FREE_PLAN_ID }}
        run: node dist/app-worker.mjs
