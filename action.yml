name: 'MyWKM README Path Guard'
description: 'README link checker for pull requests. Catch newly broken file links, including deleted targets, in one concise comment.'
author: 'Myworkingmemory'
branding:
  icon: 'link'
  color: 'blue'
inputs:
  github-token:
    description: 'GitHub token with contents:read and pull-requests:write for the target repository.'
    required: false
    default: ${{ github.token }}
  fail-on-broken:
    description: 'Fail the workflow when newly broken repository links are found.'
    required: false
    default: 'true'
  comment-author:
    description: 'Optional author login. Required for a custom GitHub App installation token; personal token authors are identified automatically.'
    required: false
outputs:
  broken-links:
    description: 'Number of newly broken repository links.'
  checked-readmes:
    description: 'Number of README files checked.'
runs:
  using: 'node24'
  main: 'dist/action.mjs'
